# The two steps every build job in .github/workflows opens with, and the two
# policies they encode. The checkout leaves no write token in .git/config
# for a later step (or a dumped config) to reuse. setup-zig resolves the
# exact compiler from minimum_zig_version in build.zig.zon when its `version`
# input is empty, and owns the compile-cache entry, so neither a Zig pin nor
# a cache key can drift between jobs.
#
# Both actions are pinned to full commit SHAs (tag in comment): a moved tag
# cannot silently change what CI executes. A job that needs a checkout but
# no toolchain (the release publish job) keeps its own checkout step.
name: checkout-zig
description: Check out the tree without leaving credentials behind, then install the pinned Zig toolchain.
runs:
  using: composite
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

# Release pipeline: on a v* tag push, build the static single-file binaries
# for both shipped targets (scripts/build_static.sh: musl, vendored libfuse3,
# static-PIE, verified no PT_INTERP / no DT_NEEDED) and attach them to a
# GitHub release with SHA256SUMS. The tag must name the version in
# build.zig.zon -- the same contract scripts/check.sh enforces on the
# CHANGELOG -- so a release can never be cut from a mismatched tag.
#
# Locally, the same build recipe is `./scripts/build_static.sh <target>`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - name: tag names the build.zig.zon version
        run: ./scripts/check_release_tag.sh
      - name: test native static release build
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dfuse-static
      - name: build static single-file binary
        run: ./scripts/build_static.sh ${{ matrix.target }} --prefix .scratch/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rel-${{ matrix.target }}
          path: .scratch/release/modelfs-*
          if-no-files-found: error

  # The sparks' documented deploy ABI: aarch64 glibc 2.39 (Ubuntu 24.04
  # libfuse3, vendored arm64 .debs) as built by scripts/cross_aarch64.sh.
  # The musl static binaries above run anywhere; this one is for the fleet
  # that already standardizes on the distro libfuse3.
  sparks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - name: tag names the build.zig.zon version
        run: ./scripts/check_release_tag.sh
      - name: cross-compile the spark binary
        run: ./scripts/cross_aarch64.sh --prefix .scratch/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rel-sparks
          path: .scratch/release/bin/modelfs
          if-no-files-found: error

  release:
    needs: [build, sparks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: package and checksum the release assets
        run: ./scripts/package_release.sh --dist dist
      - name: checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zon="$(./scripts/check_release_tag.sh "${TAG}")"
          awk -v heading="## [${zon}] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "missing changelog notes for ${TAG}" >&2
            exit 1
          fi
          cd dist
          # The packaged host-arch binary must be the one the tag named.
          test "$(./modelfs-x86_64-linux-musl version)" = "modelfs ${zon}"
          ./modelfs-x86_64-linux-musl help >/dev/null
          # A run that dies between `create --draft` and `edit
          # --draft=false` leaves an unpublished draft holding this tag
          # and its assets. A re-run has to finish that release, not die
          # on it: the whole packaging step is built to converge on a
          # re-run for exactly this case, and a draft the operator can
          # never publish is a release that silently never happened. A
          # release that is already published is still refused; replacing
          # one is a decision, not a re-run.
          if draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${draft}" != "true" ]]; then
              echo "release ${TAG} is already published; refusing to replace it" >&2
              exit 1
            fi
            echo "release ${TAG} is an unpublished draft from an earlier run; publishing it"
            gh release edit "${TAG}" --draft=false
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --draft \
            --title "modelfs ${TAG}" --notes-file release-notes.md \
            modelfs-x86_64-linux-musl modelfs-aarch64-linux-musl \
            modelfs-aarch64-linux-gnu modelfs-licenses.tar.gz SHA256SUMS
          gh release edit "${TAG}" --draft=false

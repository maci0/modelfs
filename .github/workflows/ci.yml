# Blocking gate: the same scripts/check.sh that README documents for local
# runs, so a lint/type/test failure fails CI instead of scrolling by.
name: check

on:
  push:
    branches: [main]
  pull_request:

# The gate only reads the repo; do not leak a write token into it.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the in-progress run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Zig toolchain version: no knob here on purpose. setup-zig resolves the
# exact version from minimum_zig_version in build.zig.zon when the `version`
# input is empty, so that field is the single source of truth: bumping it
# updates both jobs at once, and a parallel env pin that could drift from the
# manifest cannot exist.

jobs:
  check:
    runs-on: ubuntu-latest
    # Fail a hung run (stuck apt, wedged compile or test) instead of burning
    # the 6-hour runner default; typical runs finish well inside this.
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tag in comment): a moved tag
      # cannot silently change what CI executes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Resolves Zig from minimum_zig_version in build.zig.zon (see the env
      # note above) and verifies the tarball's minisign signature. It also
      # owns compile-cache persistence: ZIG_LOCAL_CACHE_DIR and
      # ZIG_GLOBAL_CACHE_DIR are pointed at <workspace>/.zig-cache and that
      # directory is restored/saved via its own per-job, per-version-keyed
      # actions/cache entry, so no workflow-level cache step is needed here
      # (one would only double-upload the same directory).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      # README requirement: compiling against libfuse3 needs its headers,
      # which ubuntu-latest does not preinstall.
      - name: Install libfuse3 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev

      # Python tooling exactly as pinned in requirements-dev.lock.txt
      # (hash-verified install, per README). activate-environment creates
      # .venv and puts it on PATH; the uv download/toolchain cache is on by
      # default and keyed below on the requirements files, because setup-uv's
      # **/uv.lock default glob matches nothing in this repo. With no explicit
      # python-version input, setup-uv resolves the interpreter from
      # .python-version, the same single knob local uv uses.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          activate-environment: true
          cache-dependency-glob: requirements*.txt

      - name: Install pinned Python tooling
        # check.sh invokes ruff/mypy by name from the activated venv.
        run: uv pip install --require-hashes -r requirements-dev.lock.txt

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Static analysis gate
        run: ./scripts/check.sh

  # The sparks deploy as aarch64: README documents the cross-build against the
  # vendored arm64 libfuse3, but nothing else here exercises that target, so a
  # broken aarch64 compile would ship unnoticed. Compile-only gate: the runner
  # has no /dev/fuse and no aarch64 runtime, so link success plus the ELF
  # machine type is the whole assertion.
  cross-aarch64:
    runs-on: ubuntu-latest
    # Same hang guard as the check job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same setup-zig behavior as the check job: version resolved from
      # build.zig.zon, tarball minisign-verified, and the compile cache kept
      # in a per-job-keyed entry, so the aarch64 objects stay separate from
      # the host build's.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      # The extracted root/ and lib/ trees are gitignored build inputs;
      # recreate them from the committed .deb files with the same extractor
      # script local builds run (one recipe, not two to keep in sync).
      # build.zig verifies both sha256 digests before any compilation, so
      # drifted vendored input fails this job rather than producing an
      # unchecked binary.
      - name: Extract vendored arm64 libfuse3 from the committed debs
        run: ./scripts/extract_fuse3_arm64.sh

      # ReleaseFast: the deployment build README documents, not Debug, so the
      # gate exercises the codegen that actually ships.
      - name: Cross-compile the spark-node binary
        run: |
          zig build -Dtarget=aarch64-linux-gnu.2.39 -Doptimize=ReleaseFast \
            -Dfuse-include=.deps/fuse3-arm64/root/usr/include/fuse3 \
            -Dfuse-lib=.deps/fuse3-arm64/lib
          file zig-out/bin/modelfs | grep -q 'ARM aarch64'

  # Enforces what CONTRIBUTING promises under "Cutting a release": two
  # ReleaseFast builds from differently named trees, with TZ/locale/
  # SOURCE_DATE_EPOCH varied between them, must produce byte-identical
  # binaries. scripts/repro_check.sh owns the recipe; this job only runs it,
  # so local verification and CI cannot drift apart.
  reproducibility:
    runs-on: ubuntu-latest
    # Two cold ReleaseFast builds plus checkout fit well inside the same hang
    # guard every other job carries.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same setup-zig behavior as above: exact version resolved from
      # build.zig.zon, tarball minisign-verified.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      # The script builds against the system libfuse3 like the check job does;
      # reproducibility is a property of our inputs, not of the headers' bytes
      # being identical across the two build trees (they are only read).
      - name: Install libfuse3 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev

      - name: Build twice and compare bytes
        run: ./scripts/repro_check.sh

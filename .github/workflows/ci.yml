# Blocking gate: the same scripts/check.sh that README documents for local
# runs, so a lint/type/test failure fails CI instead of scrolling by.
name: check

on:
  push:
    branches: [main]
  pull_request:

# The gate only reads the repo; do not leak a write token into it.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the in-progress run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Zig toolchain version: no knob here on purpose. setup-zig resolves the
# exact version from minimum_zig_version in build.zig.zon when the `version`
# input is empty, so that field is the single source of truth: bumping it
# updates both jobs at once, and a parallel env pin that could drift from the
# manifest cannot exist.

jobs:
  check:
    # Sparks deploy on Ubuntu 24.04; pin the runner so a ubuntu-latest jump
    # (new glibc, new libfuse3) cannot silently change what the native
    # compile tests against.
    runs-on: ubuntu-24.04
    # Fail a hung run (stuck apt, wedged compile or test) instead of burning
    # the 6-hour runner default; typical runs finish well inside this.
    timeout-minutes: 30
    steps:
      # Checkout without a leftover write token, then the pinned Zig
      # toolchain resolved from build.zig.zon. The composite action owns
      # both, and the compile-cache entry setup-zig keeps per job.
      - uses: ./.github/actions/checkout-zig
      - uses: ./.github/actions/setup-gate-tooling
      # shellcheck is preinstalled on ubuntu-24.04 runners.
      - name: Static analysis gate
        run: ./scripts/check.sh

  # The same gate natively on aarch64: GitHub's arm64 runners run every test
  # the x86_64 job runs, so aarch64-only breakage (a signed/unsigned shift, a
  # translate-c quirk, a musl/glibc assumption) fails CI instead of shipping
  # to the sparks unnoticed. Same pinned runner family, same hang guard.
  check-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/checkout-zig
      - uses: ./.github/actions/setup-gate-tooling
      - name: Static analysis gate
        run: ./scripts/check.sh

  # The sparks deploy as aarch64: README documents the cross-build against the
  # vendored arm64 libfuse3, but nothing else here exercises that target, so a
  # broken aarch64 compile would ship unnoticed. Compile-only gate: the runner
  # has no /dev/fuse and no aarch64 runtime, so link success plus the ELF
  # machine type is the whole assertion.
  cross-aarch64:
    runs-on: ubuntu-24.04
    # Same hang guard as the check job.
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/checkout-zig
      # ReleaseFast: the deployment build README documents, not Debug, so the
      # gate exercises the codegen that actually ships. Same script
      # scripts/ci.sh runs, so the flags cannot drift from a local pre-push.
      # The script extracts the committed .deb files (hash-checked against
      # .deps/fuse3-arm64/SHA256SUMS) before compiling; build.zig re-verifies
      # those digests, so drifted vendored input fails rather than producing
      # an unchecked binary.
      - name: Cross-compile the spark-node binary
        run: ./scripts/cross_aarch64.sh

  # The static single-file release builds are only exercised at tag time by
  # the release workflow; this job runs the exact same recipe on every push
  # and PR so a breakage (vendored-source drift, a link regression, an
  # assert_static_elf gap) fails CI weeks before a release depends on it.
  static-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each leg's runner is its own target's architecture, so a leg
          # can execute the binary it just built. Add a cross leg here and
          # this step needs a condition; today there is none to write.
          - target: x86_64-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: ./.github/actions/checkout-zig
      - name: Test native static release build
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dfuse-static
      - name: Build and verify the static single-file binary
        run: ./scripts/build_static.sh ${{ matrix.target }} --prefix .scratch/static
      # assert_static_elf reads the program and dynamic headers, so it
      # passes on a binary that links cleanly and then cannot start: a
      # static-PIE relocation musl rejects at load, a musl init path that
      # faults, a vendored libfuse3 constructor that runs before main.
      # release.yml's publish job smoke-tests the x86_64 binary, but only
      # at tag time, so nothing caught that between pushes. `version`
      # exits 0 without touching /dev/fuse, the origin, or the network.
      # The artifact name is modelfs-<arch>-linux-musl, which for both
      # shipped targets is modelfs-<target>.
      - name: Run the static single-file binary
        run: .scratch/static/modelfs-${{ matrix.target }} version

  # Enforces what CONTRIBUTING promises under "Cutting a release": two
  # ReleaseFast builds from differently named trees, with TZ/locale/
  # SOURCE_DATE_EPOCH varied between them, must produce byte-identical
  # binaries. scripts/repro_check.sh owns the recipe; this job only runs it,
  # so local verification and CI cannot drift apart. It covers all four
  # shipped recipes, including the aarch64 glibc spark binary the release
  # attaches: the script extracts the vendored arm64 libfuse3 itself, so no
  # extra setup step is needed here beyond the headers the host leg reads.
  reproducibility:
    runs-on: ubuntu-24.04
    # Eight cold ReleaseFast builds (four shipped recipes, built twice each)
    # plus checkout fit well inside the same hang guard every other job
    # carries.
    timeout-minutes: 45
    steps:
      - uses: ./.github/actions/checkout-zig
      # The script builds against the system libfuse3 like the check job does;
      # reproducibility is a property of our inputs, not of the headers' bytes
      # being identical across the two build trees (they are only read).
      - name: Install libfuse3 development files
        run: ./scripts/install_libfuse3_dev.sh

      - name: Build twice and compare bytes
        run: ./scripts/repro_check.sh

# Blocking gate: the same scripts/check.sh that README documents for local
# runs, so a lint/type/test failure fails CI instead of scrolling by.
name: check

on:
  push:
    branches: [main]
  pull_request:

# The gate only reads the repo; do not leak a write token into it.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the in-progress run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Single knob for the toolchain version both jobs must agree on
# (build.zig.zon declares minimum_zig_version 0.16.0); bump in one place.
env:
  ZIG_VERSION: "0.16.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in comment): a moved tag
      # cannot silently change what CI executes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Warm compile cache for zig build test. Zig hashes every input itself,
      # so a stale hit cannot produce a wrong result; restore-keys keeps the
      # cache warm across source-only edits. Keyed per job so host and
      # aarch64 objects never mix.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-check-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-check-

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # README requirement: compiling against libfuse3 needs its headers,
      # which ubuntu-latest does not preinstall.
      - name: Install libfuse3 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev

      # Python tooling exactly as pinned in requirements-dev.lock.txt
      # (hash-verified install, per README). activate-environment creates
      # .venv and puts it on PATH; the uv download/toolchain cache is on by
      # default and keyed on requirements*.txt.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install pinned Python tooling
        # check.sh invokes ruff/mypy by name from the activated venv.
        run: uv pip install --require-hashes -r requirements-dev.lock.txt

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Static analysis gate
        run: ./scripts/check.sh

  # The sparks deploy as aarch64: README documents the cross-build against the
  # vendored arm64 libfuse3, but nothing else here exercises that target, so a
  # broken aarch64 compile would ship unnoticed. Compile-only gate: the runner
  # has no /dev/fuse and no aarch64 runtime, so link success plus the ELF
  # machine type is the whole assertion.
  cross-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same warm compile cache, job-scoped so the aarch64 objects stay
      # separate from the host build's (see the check job).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-cross-aarch64-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-cross-aarch64-

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The extracted root/ and lib/ trees are gitignored build inputs;
      # recreate them from the committed .deb files exactly as
      # .deps/fuse3-arm64/README.md prescribes. build.zig verifies both
      # sha256 digests before any compilation, so drifted vendored input
      # fails this job rather than producing an unchecked binary.
      - name: Extract vendored arm64 libfuse3 from the committed debs
        run: |
          cd .deps/fuse3-arm64
          dpkg-deb -x libfuse3-3_3.14.0-5build1_arm64.deb root/
          dpkg-deb -x libfuse3-dev_3.14.0-5build1_arm64.deb root/
          mkdir -p lib
          ln -s libfuse3.so.3 lib/libfuse3.so
          ln -s ../root/lib/aarch64-linux-gnu/libfuse3.so.3.14.0 lib/libfuse3.so.3

      - name: Cross-compile the spark-node binary
        run: |
          zig build -Dtarget=aarch64-linux-gnu.2.39 \
            -Dfuse-include=.deps/fuse3-arm64/root/usr/include/fuse3 \
            -Dfuse-lib=.deps/fuse3-arm64/lib
          file zig-out/bin/modelfs | grep -q 'ARM aarch64'

# The workflows pin every action to a full commit SHA, so nothing in the
# tree upgrades them: a pin ages until the action's runtime is retired and
# the job starts failing for a reason no commit here explains. Dependabot
# proposes the bump instead of applying it, as a reviewable PR that carries
# the new SHA and its tag. scripts/sbom.py reads the pins out of
# .github/workflows and .github/actions, so a merged bump fails
# `sbom.py --check` until sbom.cdx.json is regenerated: a rotated action pin
# is a recorded change, not a silent one.
#
# The Python gate tooling (ruff, mypy) is pinned exactly in pyproject.toml
# and locked with sha256 hashes in uv.lock; a stale or vulnerable pin ages
# the same way a workflow pin does. Dependabot proposes the bump as a
# reviewable PR; the `uv` ecosystem updates pyproject.toml and uv.lock
# together, so merging still needs only a regenerated sbom.cdx.json, the
# same recorded-change rule as an action bump. The `pip` ecosystem would
# edit a requirements file in isolation and leave uv.lock stale, which
# `uv sync --frozen` in check.sh then rejects.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly

# Autosnap + autoprune for tank/models. Install as /etc/sanoid/sanoid.conf
# (scripts/install_nas_backup.sh). Counts match docs/recovery.md section 3:
# hourly RPO for deletion/corruption, 30 dailies, 3 monthlies. Tune only
# when spare pool capacity cannot hold 69 snapshots of the live dataset.

[tank/models]
	use_template = production
	# Directories under this dataset are not child datasets today
	# (operations.md). recursive covers a later zfs create of
	# tank/models/gguf or similar so backup scope cannot shrink
	# silently when the layout grows.
	recursive = yes

[template_production]
	hourly = 36
	daily = 30
	monthly = 3
	autosnap = yes
	autoprune = yes

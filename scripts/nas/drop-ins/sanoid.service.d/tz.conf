[Service]
# sanoid has no timezone knob: its hourly/daily/monthly snapshot NAMES come
# from the host's TZ. On a NAS set to a DST zone, spring-forward skips one
# hourly wall-clock name and fall-back lands two snapshots in the same name,
# so the 1 h RPO in docs/recovery.md holds for every interval except the
# one the transition deletes. TZ=UTC makes the period boundary an instant,
# so every hourly boundary is a real hour of elapsed time on any host.
# This is the shipped policy; a site that wants local-hour names can remove
# the drop-in, at the cost of the DST hole in the RPO.
Environment=TZ=UTC

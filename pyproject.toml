# Static analysis configuration for the Python tooling under scripts/.
[tool.ruff]
line-length = 100
# Matches .python-version and the CI interpreter: the only runtimes these
# scripts are ever installed and run under.
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, bugbear, pyupgrade, simplify,
# pylint's defect-oriented subset, and ruff-specific hygiene.
# Plus defect-oriented groups: builtin shadowing (A), unused arguments
# (ARG), comprehension pitfalls (C4), naive datetimes (DTZ),
# private-member access (SLF), committed debuggers (T10), correctness
# around yields (YTT) and implicit string concatenation (ISC),
# suppression hygiene (PGH), performance anti-patterns (PERF),
# refactoring/modernization (FURB), redundant constructs (PIE),
# return simplification (RET), dead commented-out code (ERA),
# import hygiene (TID), implicit namespace packages (INP), naming
# conventions (N), typing-only imports left at runtime (TC), function
# complexity (C90), blocking calls inside asyncio loops (ASYNC),
# blind exception catches (BLE), redundant raise parens (RSE),
# exception-handling anti-patterns (TRY), exception messages that hide
# context in inline literals (EM), executable-bit vs shebang mismatches
# (EXE), and boolean-trap positional flags (FBT).
select = [
    "E", "F", "W", "B", "UP", "SIM", "PL", "RUF", "A", "ARG", "C4", "DTZ",
    "SLF", "T10", "YTT", "ISC", "PGH", "PERF", "FURB", "PIE", "RET", "ERA",
    "TID", "INP", "N", "TC", "C90", "ASYNC", "BLE", "RSE", "TRY", "EM",
    "EXE", "FBT",
]

[tool.mypy]
strict = true
# mypy's second bundle beyond --strict: everything under --extra-checks
# (today overlapping the explicit error codes below; tomorrow it also picks
# up new opt-in checks in the 2.x line instead of leaving them off).
extra_checks = true
# Beyond the strict bundle: flag unreachable code and redundant/truthiness
# mistakes, require code-scoped ignores, catch possibly-undefined names,
# overriding methods that widen mutable base attributes, use of APIs
# deprecated in the stdlib, explicit "Any" annotations (escape
# hatches must be inferred-and-narrowed, not spelled out), Any leaking in
# from untyped imports or module globals, None-vs-type overlap checks,
# overrides missing @override, empty bodies hiding unimplemented logic,
# and abstract types used where a concrete instance is required.
disallow_any_explicit = true
disallow_any_unimported = true
disallow_untyped_globals = true
strict_equality_for_none = true
warn_unreachable = true
# Not part of --strict: a dead or mistyped key in this very file must fail
# the check instead of silently doing nothing.
warn_unused_configs = true
enable_error_code = [
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "explicit-override",
    "empty-body",
    "type-abstract",
    # match arms must cover every variant, not fall through silently
    "exhaustive-match",
    # reveal_type must be imported, not relied on leaking from a stub
    "unimported-reveal",
    # an awaited value assigned and dropped must not pass silently
    "unused-awaitable",
]


# Static analysis configuration for the Python tooling under scripts/.

# Floor/ceiling for the uv that resolves the lock and that CI installs.
# setup-uv reads this field when its `version` input is empty, so a bump
# here updates local `uv` and the check job together. Cap before the next
# breaking release the same way requirements-dev.txt caps ruff/mypy.
[tool.uv]
required-version = ">=0.12,<0.13"

[tool.ruff]
line-length = 100
# Matches .python-version and the CI interpreter: the only runtimes these
# scripts are ever installed and run under.
target-version = "py312"
# Same bounds as requirements-dev.txt: a bare ruff outside the pinned venv
# with different semantics must refuse to run instead of silently
# disagreeing with the CI gate.
required-version = ">=0.16,<0.17"

[tool.ruff.lint]
# Every group, including preview: a new prefix that lands in the pinned
# 0.16 line starts failing this gate instead of staying off by not being
# listed. Formatter preview stays off (it would reformat dict literals).
# Ignores are only the exceptions this tree does not pass, each named.
# Selectors are rule names, not codes, so preview rule-codes-in-selectors
# cannot hide on pyproject.toml (scripts/check.sh runs a pathless
# `ruff check`, which includes this file).
preview = true
select = ["ALL"]
ignore = [
    # CLI harnesses print to stdout/stderr as their interface.
    "print",
    # Conflicts with ruff format (the formatter owns trailing commas).
    "missing-trailing-comma",
    # Internal scripts, not a published library: no pydocstyle,
    # pydoclint, or copyright-header convention.
    "D",
    "DOC",
    "CPY",
    # Preview: prefer `ruff: ignore` over `noqa`. noqa stays so a comment
    # that also names a bandit code remains valid for both tools.
    "noqa-comments",
    # Preview nits this tree does not pass: repeated list.append,
    # too-many-locals, empty-string comparisons.
    "repeated-append",
    "too-many-locals",
    "compare-to-empty-string",
    # Preview: import of subprocess is the documented spawn path
    # (subprocess-without-shell-equals-true still flags each call; those
    # are noqa'd with a reason).
    "suspicious-subprocess-import",
]

# Flag typing-only imports even when a runtime sibling from the same
# module exists; the scripts already pass this.
[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
# Formatter also normalizes Python snippets inside docstrings, so examples
# cannot drift below the same bar as real code.
docstring-code-format = true

[tool.mypy]
strict = true
# Analyze against the declared runtime (.python-version, which the check
# job reads into setup-uv's python-version): a bare mypy run under a
# different local interpreter must not silently check different stdlib
# semantics than the gate does.
python_version = "3.12"
# Linux-only tree: pin the platform so a check on another OS cannot
# silently skip Linux-only branches or apply Darwin/Windows stdlib.
platform = "linux"
# Same target set scripts/check.sh passes, so a bare `mypy` matches the gate.
files = ["scripts"]
# A third-party import without stubs or a py.typed marker is checked,
# not silently typed as Any. This tree already passes it.
follow_untyped_imports = true
# typeshed gaps surface instead of silently becoming Any once
# --disallow-untyped-defs is on (it is: --strict).
warn_incomplete_stub = true
# mypy's second bundle beyond --strict: everything under --extra-checks
# (today overlapping the explicit error codes below; tomorrow it also picks
# up new opt-in checks in the 2.x line instead of leaving them off).
extra_checks = true
# A partial type assigned in one branch must be completed in the same
# scope; a later use cannot silently see an incomplete annotation.
local_partial_types = true
# Incomplete features this tree already passes: tuple types keep their
# length and element precision across operations, and inline TypedDict
# shapes are checked instead of degrading to dict[str, Any].
enable_incomplete_feature = ["PreciseTupleTypes", "InlineTypedDict"]
# Beyond the strict bundle: flag unreachable code and redundant/truthiness
# mistakes, require code-scoped ignores, catch possibly-undefined names,
# overriding methods that widen mutable base attributes, use of APIs
# deprecated in the stdlib, explicit "Any" annotations (escape
# hatches must be inferred-and-narrowed, not spelled out), Any leaking in
# from untyped imports or module globals, None-vs-type overlap checks,
# overrides missing @override, empty bodies hiding unimplemented logic,
# and abstract types used where a concrete instance is required.
disallow_any_explicit = true
disallow_any_unimported = true
disallow_untyped_globals = true
# A decorator whose signature erases to Any must not silently untype the
# decorated function; the strict bundle does not cover this.
disallow_any_decorated = true
strict_equality_for_none = true
# bytes accepts only bytes, not str-like objects: the py314 semantics pulled
# forward so a bytes/str mixup cannot hide behind implicit coercions.
strict_bytes = true
warn_unreachable = true
# Not part of --strict: a dead or mistyped key in this very file must fail
# the check instead of silently doing nothing.
warn_unused_configs = true
enable_error_code = [
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "mutable-override",
    "deprecated",
    "explicit-override",
    "empty-body",
    "type-abstract",
    # match arms must cover every variant, not fall through silently
    "exhaustive-match",
    # reveal_type must be imported, not relied on leaking from a stub
    "unimported-reveal",
    # an awaited value assigned and dropped must not pass silently
    "unused-awaitable",
    # a value narrowed to a type the declared annotation cannot hold is a
    # latent AttributeError/TypeError at runtime, not a style nit
    "narrowed-type-not-subtype",
    # --strict already turns warn_unused_ignores and warn_redundant_casts
    # on; listing the codes keeps every default-off extra code in this one
    # list so a later --strict reshape cannot drop them silently.
    "unused-ignore",
    "redundant-cast",
]

